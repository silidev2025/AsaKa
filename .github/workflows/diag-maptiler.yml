name: Diagnose map tiles
on:
  push:
    branches: [diag-maptiler]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe OpenFreeMap
        run: |
          CODE=$(curl -s -o tj.json -w "%{http_code}" -H "Origin: https://localhost" https://tiles.openfreemap.org/planet)
          echo "::notice::ofm tilejson -> HTTP $CODE: $(head -c 300 tj.json | tr -c '[:print:]' ' ')"
          TPL=$(jq -r '.tiles[0]' tj.json)
          for zxy in 14/13829/7720 14/13830/7720 14/13829/7721 14/13830/7721; do
            URL=${TPL/\{z\}\/\{x\}\/\{y\}/$zxy}
            CODE=$(curl -s --compressed -o t.pbf -w "%{http_code}" -H "Origin: https://localhost" "$URL")
            echo "::notice::ofm tile $zxy -> HTTP $CODE, $(wc -c < t.pbf) bytes, building layer: $(grep -c -a 'building' t.pbf), render_height: $(grep -c -a 'render_height' t.pbf), cors: $(curl -s -I -H 'Origin: https://localhost' "$URL" | grep -i 'access-control-allow-origin' | tr -d '\r')"
          done
